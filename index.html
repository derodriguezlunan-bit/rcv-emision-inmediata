<!-- SECCIÓN: DATOS DEL VEHÍCULO (MANUAL) -->
<div class="space-y-4">
    <h3 class="text-lg font-semibold text-emerald-400 mb-2">Datos del Vehículo</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-300">Placa *</label>
            <input type="text" name="placa" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: AF147MM">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Marca *</label>
            <input type="text" name="marca" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: TOYOTA">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Modelo *</label>
            <input type="text" name="modelo" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: COROLLA 1.6">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Año *</label>
            <input type="text" name="anio" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: 2004">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Color *</label>
            <input type="text" name="color" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: GRIS PLATA">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Tipo *</label>
            <input type="text" name="tipo" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: Particular">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Uso *</label>
            <input type="text" name="uso" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: Particular">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Origen *</label>
            <input type="text" name="origen" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: NACIONAL">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Peso *</label>
            <input type="text" name="peso" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: 1050">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300">Capacidad (Puestos) *</label>
            <input type="text" name="puestos" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: 5">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-300">Número de serial carrocería *</label>
            <input type="text" name="serial_carroceria" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: 8XA53ZEC149501931">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-300">Número de motor *</label>
            <input type="text" name="serial_motor" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" placeholder="Ej: 8XA53ZEC149501931">
        </div>
    </div>
</div>
