<form id="form-emision-rcv" class="space-y-6">
    
    <!-- Sección: Datos del Cliente -->
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Cliente / Tomador de la póliza</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Cédula / RIF</label>
                <input type="text" name="cedula" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="V-16473677">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                <input type="text" name="nombre_completo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="NESTOR DANIEL RODRIGUEZ LUNA">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
                <input type="email" name="correo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="derodriguezlunam@gmail.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Teléfono</label>
                <input type="text" name="telefono" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="04144668241">
            </div>
        </div>
    </div>

    <!-- Sección: Datos del Vehículo (Información básica, detalles específicos y adicional) -->
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Datos del vehículo</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Información básica -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Placa</label>
                <input type="text" name="placa" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="AF147MM">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Marca</label>
                <input type="text" name="marca" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="TOYOTA">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Modelo</label>
                <input type="text" name="modelo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="COROLLA 1.6 A/T">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Año</label>
                <input type="text" name="anio" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="2004">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Color</label>
                <input type="text" name="color" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="GRIS PLATA">
            </div>

            <!-- Detalles específicos -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Tipo</label>
                <input type="text" name="tipo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Particular">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Uso</label>
                <input type="text" name="uso" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Particular">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Origen</label>
                <input type="text" name="origen" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="NACIONAL">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Peso</label>
                <input type="text" name="peso" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="1050">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Capacidad (Puestos)</label>
                <input type="text" name="puestos" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="5">
            </div>

            <!-- Información adicional (Seriales) -->
            <div class="md:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-4 mt-2 pt-4 border-t border-gray-100">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Número de serial carrocería</label>
                    <input type="text" name="serial_carroceria" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="8XA53ZEC149501931">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Número de motor</label>
                    <input type="text" name="serial_motor" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="8XA53ZEC149501931">
                </div>
            </div>
        </div>
    </div>

    <!-- Botón de Envío -->
    <div class="flex justify-end">
        <button type="submit" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
            Procesar y Generar WhatsApp
        </button>
    </div>
</form>
